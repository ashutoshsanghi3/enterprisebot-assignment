apiVersion: apps/v1
kind: Deployment
metadata:
  name: reporter
  labels:
    app: reporter
    {{- include "lab.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.reporter.replicas }}
  selector:
    matchLabels:
      app: reporter
  template:
    metadata:
      labels:
        app: reporter
        {{- include "lab.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.reporter.serviceAccountName }}
      containers:
        - name: reporter
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.common.port }}
          env:
            - name: PORT
              value: {{ .Values.common.port | quote }}
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- range $name, $value := .Values.reporter.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.common.port }}
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.reporter.resources | nindent 12 }}
          volumeMounts:
            - name: cache-volume
              mountPath: /var/cache/app
      volumes:
        - name: cache-volume
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: reporter
  labels:
    app: reporter
    {{- include "lab.labels" . | nindent 4 }}
spec:
  selector:
    app: reporter
  ports:
    - name: http
      port: 8080
      targetPort: {{ .Values.common.port }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.reporter.serviceAccountName }}
  labels:
    app: reporter
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: reporter-pod-reader
  namespace: {{ .Release.Namespace }}
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: reporter-read-pods
  namespace: {{ .Release.Namespace }}
subjects:
- kind: ServiceAccount
  name: {{ .Values.reporter.serviceAccountName }}
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: reporter-pod-reader
  apiGroup: rbac.authorization.k8s.io
